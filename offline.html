<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0E" />
<title>离线 · 生活工作台</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --t1:#1d1d1f; --t2:#6e6e73;
    --bd:#e5e5ea; --ac:#0A84FF; --muted:#aeaeb2;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0D0D0E; --card:#1c1c1e; --t1:#f5f5f7; --t2:#98989d;
      --bd:#2c2c2e; --ac:#0A84FF; --muted:#636366;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--t1);
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align:center;
  }
  .box{width:100%; max-width:340px}
  .ic{
    width:64px; height:64px; margin:0 auto 18px; border-radius:18px;
    background:var(--card); border:1px solid var(--bd);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted);
  }
  .ic svg{width:32px; height:32px}
  h1{font-size:19px; font-weight:600; margin:0 0 8px; letter-spacing:.2px}
  p{font-size:14px; line-height:1.5; color:var(--t2); margin:0 0 22px}
  button{
    appearance:none; border:0; cursor:pointer;
    font-size:15px; font-weight:600; color:#fff; background:var(--ac);
    padding:12px 22px; border-radius:12px; min-height:44px;
    font-family:inherit;
  }
  button:active{opacity:.85}
  .hint{margin-top:16px; font-size:12px; color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>你已离线</h1>
    <p>当前没有网络连接，且本地没有可用的缓存版本。<br/>恢复网络后重试即可继续使用。</p>
    <button onclick="location.reload()">重试</button>
    <div class="hint">本地数据已安全保存在设备上</div>
  </div>
</body>
</html>
